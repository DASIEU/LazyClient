name: Sync upstream TClient

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: lazy-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: lazy

      - name: Configure git identity
        run: |
          git config user.name "LazyClient Bot"
          git config user.email "lazyclient-bot@users.noreply.github.com"

      - name: Fetch upstream TClient
        run: |
          git remote add upstream https://github.com/TaterClient/TClient.git || true
          git fetch upstream master

      - name: Merge upstream master
        id: merge
        run: |
          git checkout -B sync/upstream lazy
          if git merge --no-edit upstream/master; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      - name: Push clean sync branch
        if: steps.merge.outputs.clean == 'true'
        run: git push --force origin sync/upstream

      - name: Open pull request
        if: steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Sync upstream TClient ($(date -u +%Y-%m-%d))"
          BODY=$'Automated merge of `upstream/master` into `lazy`.\n\nReview conflicts and regressions before merging.'
          if gh pr view sync/upstream --json number >/dev/null 2>&1; then
            gh pr edit sync/upstream --title "$TITLE" --body "$BODY"
          else
            gh pr create \
              --base lazy \
              --head sync/upstream \
              --title "$TITLE" \
              --body "$BODY" || true
          fi

      - name: Report conflicts
        if: steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream TClient sync has conflicts ($(date -u +%Y-%m-%d))"
          existing="$(gh issue list --state open --search "Upstream TClient sync has conflicts in:title" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "$TITLE" \
              --body $'Automated merge of `upstream/master` into `lazy` has conflicts.\n\nRun the sync locally or resolve conflicts manually, then push `sync/upstream`.' \
              || true
          fi
